services:
  - type: web
    name: vibecheck-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: VIBECHECK_DB_ENGINE
        value: postgresql
      - key: VIBECHECK_DATABASE_URL
        sync: false
      - key: VIBECHECK_CORS_ORIGINS
        value: https://vibecheck-website.vercel.app
      - key: VIBECHECK_FRONTEND_URL
        value: https://vibecheck-website.vercel.app
      - key: VIBECHECK_SEED_DEMO_USER
        value: false
      - key: VIBECHECK_RATE_LIMIT
        value: true
